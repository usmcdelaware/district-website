<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My First GitHub Pages Site</title>
  <meta name="description" content="A simple static site built in VS Code." />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <strong class="brand">My Site</strong>

      <nav class="nav">
        <a href="#projects">Projects</a>
        <a href="#about">About</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <p class="kicker">Welcome</p>
        <h1>Hello, GitHub Pages 👋</h1>
        <p class="subhead">
          This page is being built locally in VS Code and will be deployed as a static site.
        </p>
      </div>
    </section>

    <section id="projects" class="section">
      <div class="container">
        <h2>Projects</h2>
        <p>This is where links to your work will go.</p>
      </div>
    </section>

    <section id="about" class="section alt">
      <div class="container">
        <h2>About</h2>
        <p>
          Edit this text to describe what this site is for.
          Everything here is just HTML.
        </p>

        <button id="helloBtn">Click me</button>
        <p id="helloOut"></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span></p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
