<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sagtikos District Calendar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/favicon.png">

  <!-- MAIN SITE STYLES -->
  <link rel="stylesheet" href="assets/css/styles.css">

  <style>
html, body {
  height: 100%;
  margin: 0;
}

/* iOS-friendly viewport height */
.calendar-container {
  height: calc((var(--vh, 1vh) * 100) - 96px);
  padding-bottom: env(safe-area-inset-bottom);
}

.calendar-frame {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
  background: white;
}

  </style>
</head>

<body>

  <!-- SITE HEADER / NAV -->
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <img src="assets/img/district-logo.png" alt="Sagtikos District logo" class="brand-logo">
        <span class="brand-text">Sagtikos District Program</span>
      </a>

      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="calendar.html" aria-current="page">Calendar</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="resources.html">Resources</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <!-- CALENDAR -->
  <main class="calendar-container">
    <iframe
      class="calendar-frame"
      src="https://www.sccbsa.org/calendar/district/572/Sagtikos"
      loading="lazy"
      referrerpolicy="no-referrer"
      title="Sagtikos District Calendar"
    ></iframe>
  </main>

</body>
</html>
